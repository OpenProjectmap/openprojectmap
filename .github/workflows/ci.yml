name: CI
on:
  push:
    branches: [main, beta]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Everything runs on GitHub-hosted runners (free for public repos). What blocks a merge runs on
  # Ubuntu: Node 22 for task PRs, Node 20 and 22 for release PRs (to main) and pushes to main. macOS
  # and Windows run as an advisory job (`cross-os`) on those same release runs; it is not part of
  # `CI result`.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      full: ${{ steps.pick.outputs.full }}
    steps:
      - id: pick
        env:
          FULL: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          if [ "$FULL" = "true" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","runner":"ubuntu-latest","node":20},{"os":"ubuntu-latest","runner":"ubuntu-latest","node":22}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-latest","runner":"ubuntu-latest","node":22}]}' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Node first: pnpm's installer runs on the Node in PATH.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # macOS and Windows on GitHub-hosted runners. Advisory: not part of `CI result`.
  cross-os:
    name: cross-os (${{ matrix.os }}, node ${{ matrix.node }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  quality:
    name: quality report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node first: pnpm's installer runs on the Node in PATH.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Run quality checks
        shell: bash
        run: |
          set +e
          pnpm format:check > format.log 2>&1;      echo $? > format.rc
          pnpm lint --max-warnings 0 > lint.log 2>&1; echo $? > lint.rc
          pnpm typecheck > typecheck.log 2>&1;      echo $? > typecheck.rc
          pnpm test:coverage > coverage.log 2>&1;   echo $? > coverage.rc
          # Gate on what ships (runtime deps; there are none, D5). Dev tooling is audited too, but
          # a dev-only advisory is reported in the summary and does not fail the build.
          pnpm audit --prod --audit-level high > audit.log 2>&1; echo $? > audit.rc
          pnpm audit --dev --audit-level high > audit-dev.log 2>&1; echo $? > audit-dev.rc
          pnpm build > build.log 2>&1;              echo $? > build.rc
          # Dogfood: the project's own docs must pass its own checker. No git facts, so the result
          # depends only on the files and the date (a Now block older than 14 days is stale).
          node dist/cli.js check --strict --no-git > dogfood.log 2>&1; echo $? > dogfood.rc
          {
            echo "## Quality report"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            for c in format lint typecheck coverage audit build dogfood; do
              if [ "$(cat $c.rc)" = "0" ]; then r="pass"; else r="**FAIL**"; fi
              echo "| $c | $r |"
            done
            echo
            if [ "$(cat audit-dev.rc)" != "0" ]; then
              echo "> Dev-dependency advisory (does not fail the build):"
              echo '```'
              head -20 audit-dev.log
              echo '```'
              echo
            fi
            echo "### Coverage"
            echo '```'
            grep -E "^( *File|All files|.*\|)" coverage.log | head -30
            echo '```'
            for c in format lint typecheck coverage audit build dogfood; do
              if [ "$(cat $c.rc)" != "0" ]; then
                echo "<details><summary>$c output</summary>"
                echo
                echo '```'
                tail -40 $c.log
                echo '```'
                echo "</details>"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for c in format lint typecheck coverage audit build dogfood; do
            if [ "$(cat $c.rc)" != "0" ]; then
              fail=1
              # Also print the failure in the job log, so it can be read without the run summary.
              echo "::group::$c failed"
              tail -60 "$c.log"
              echo "::endgroup::"
              echo "::error::$c failed"
            fi
          done
          exit $fail

  branch-flow:
    name: branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A PR to main must come from beta
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "beta" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs to main must come from the beta branch of this repo, once a version is complete. Open your PR against beta instead."
            exit 1
          fi
      - name: A PR to beta must not come from main
        if: github.event_name == 'pull_request' && github.base_ref == 'beta' && github.head_ref == 'main'
        run: |
          echo "::error::Do not merge main into beta through a PR; open a task branch instead."
          exit 1

  # Real-browser checks (axe-core with colour contrast, spec 05 §7). Advisory until the first
  # green run: it is not part of `CI result`, so a failure here does not block a merge.
  e2e:
    name: e2e (axe)
    needs: plan
    if: needs.plan.outputs.full == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore

  # The composite Action in action/, run against this repo's own docs.
  action:
    name: action
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: map
        uses: ./action
        with:
          strict: 'true'
          out: ${{ runner.temp }}/map
      - name: The map was written
        env:
          OUT: ${{ steps.map.outputs.out }}
        run: test -s "$OUT/index.html"

  # What this pull request changes in the roadmap, in the run summary. Advisory: not part of `CI result`.
  roadmap-diff:
    name: roadmap diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Roadmap changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node dist/cli.js diff "origin/$BASE_REF" --format markdown >> "$GITHUB_STEP_SUMMARY"

  # Builds the self-host image and checks what a self-hoster would see. Advisory until it has proven stable.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/docker-smoke.sh

  ci-result:
    name: CI result
    if: always()
    needs: [plan, test, quality, branch-flow, action]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "A required job did not succeed."; exit 1; fi
          done
