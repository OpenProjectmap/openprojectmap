name: CI
on:
  push:
    branches: [main, beta]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # macOS minutes cost 10x and Windows 2x. The full matrix runs on release PRs (to main) and on
  # pushes to main; everything else runs one fast leg (ubuntu, Node 22).
  plan:
    name: plan
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          FULL: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","runner":["ubuntu-latest"],"node":20},{"os":"ubuntu-latest","runner":["ubuntu-latest"],"node":22},{"os":"macos-latest","runner":["macos-latest"],"node":20},{"os":"macos-latest","runner":["macos-latest"],"node":22},{"os":"windows-latest","runner":["windows-latest"],"node":20},{"os":"windows-latest","runner":["windows-latest"],"node":22}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"self-hosted","runner":["self-hosted","Linux","X64"],"node":22}]}' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Node first: pnpm's installer runs on the Node in PATH, and a self-hosted runner's can be old.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  quality:
    name: quality report
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node first: pnpm's installer runs on the Node in PATH, and a self-hosted runner's can be old.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Run quality checks
        shell: bash
        run: |
          set +e
          pnpm format:check > format.log 2>&1;      echo $? > format.rc
          pnpm lint --max-warnings 0 > lint.log 2>&1; echo $? > lint.rc
          pnpm typecheck > typecheck.log 2>&1;      echo $? > typecheck.rc
          pnpm test:coverage > coverage.log 2>&1;   echo $? > coverage.rc
          # Gate on what ships (runtime deps; there are none, D5). Dev tooling is audited too, but
          # a dev-only advisory is reported in the summary and does not fail the build.
          pnpm audit --prod --audit-level high > audit.log 2>&1; echo $? > audit.rc
          pnpm audit --dev --audit-level high > audit-dev.log 2>&1; echo $? > audit-dev.rc
          pnpm build > build.log 2>&1;              echo $? > build.rc
          {
            echo "## Quality report"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            for c in format lint typecheck coverage audit build; do
              if [ "$(cat $c.rc)" = "0" ]; then r="pass"; else r="**FAIL**"; fi
              echo "| $c | $r |"
            done
            echo
            if [ "$(cat audit-dev.rc)" != "0" ]; then
              echo "> Dev-dependency advisory (does not fail the build):"
              echo '```'
              head -20 audit-dev.log
              echo '```'
              echo
            fi
            echo "### Coverage"
            echo '```'
            grep -E "^( *File|All files|.*\|)" coverage.log | head -30
            echo '```'
            for c in format lint typecheck coverage audit build; do
              if [ "$(cat $c.rc)" != "0" ]; then
                echo "<details><summary>$c output</summary>"
                echo
                echo '```'
                tail -40 $c.log
                echo '```'
                echo "</details>"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for c in format lint typecheck coverage audit build; do
            [ "$(cat $c.rc)" = "0" ] || fail=1
          done
          exit $fail

  branch-flow:
    name: branch flow
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: A PR to main must come from beta
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "beta" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs to main must come from the beta branch of this repo, once a version is complete. Open your PR against beta instead."
            exit 1
          fi
      - name: A PR to beta must not come from main
        if: github.event_name == 'pull_request' && github.base_ref == 'beta' && github.head_ref == 'main'
        run: |
          echo "::error::Do not merge main into beta through a PR; open a task branch instead."
          exit 1

  ci-result:
    name: CI result
    if: always()
    needs: [plan, test, quality, branch-flow]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "A required job did not succeed."; exit 1; fi
          done
