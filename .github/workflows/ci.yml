name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  quality:
    name: quality report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run quality checks
        shell: bash
        run: |
          set +e
          pnpm format:check > format.log 2>&1;      echo $? > format.rc
          pnpm lint --max-warnings 0 > lint.log 2>&1; echo $? > lint.rc
          pnpm typecheck > typecheck.log 2>&1;      echo $? > typecheck.rc
          pnpm test:coverage > coverage.log 2>&1;   echo $? > coverage.rc
          pnpm audit --audit-level high > audit.log 2>&1; echo $? > audit.rc
          pnpm build > build.log 2>&1;              echo $? > build.rc
          {
            echo "## Quality report"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            for c in format lint typecheck coverage audit build; do
              if [ "$(cat $c.rc)" = "0" ]; then r="pass"; else r="**FAIL**"; fi
              echo "| $c | $r |"
            done
            echo
            echo "### Coverage"
            echo '```'
            grep -E "^( *File|All files|.*\|)" coverage.log | head -30
            echo '```'
            for c in format lint typecheck coverage audit build; do
              if [ "$(cat $c.rc)" != "0" ]; then
                echo "<details><summary>$c output</summary>"
                echo
                echo '```'
                tail -40 $c.log
                echo '```'
                echo "</details>"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for c in format lint typecheck coverage audit build; do
            [ "$(cat $c.rc)" = "0" ] || fail=1
          done
          exit $fail

  ci-result:
    name: CI result
    if: always()
    needs: [test, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "A required job did not succeed."; exit 1; fi
          done
