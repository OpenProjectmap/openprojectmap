name: Release
# Runs when a version tag is pushed to main (vX.Y.Z). Publishes to npm with provenance through
# trusted publishing (OIDC: no npm token is stored anywhere) and creates the GitHub Release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing and provenance
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships npm 10, which would send an
      # unauthenticated upload and get a 404.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@11
          npm --version
      - name: The tag must match package.json and sit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main. Release from the merge commit of the beta to main PR."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli.js check --strict --no-git
      - name: Is this version already on npm?
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "openprojectmap@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "openprojectmap@$version is already on npm (the first publish is done by hand); skipping the publish step."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with provenance
        if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
      - name: Extract the changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?"v"\\]?" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release $version" > release-notes.md; fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
