version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  # The MCP server package (0.6.0-D2) has runtime dependencies, so each update is its own pull request.
  - package-ecosystem: npm
    directory: /packages/mcp
    target-branch: beta
    schedule:
      interval: weekly
