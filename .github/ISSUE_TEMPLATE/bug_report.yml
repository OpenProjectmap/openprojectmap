name: Bug report
description: Something does not work, or the map looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Please do not paste secrets or private roadmaps. For a security problem, follow SECURITY.md instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what did you see? Paste the output of `npx openprojectmap doctor` if you can.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: A minimal doc that shows it
      description: The smallest ROADMAP, DECISIONS or CHANGELOG snippet that triggers the problem. Remove anything private.
      render: markdown
  - type: input
    id: version
    attributes:
      label: openprojectmap version
      placeholder: '0.2.0'
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
