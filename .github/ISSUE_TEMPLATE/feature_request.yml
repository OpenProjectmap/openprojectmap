name: Idea or feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, in your own words. A solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: markdown
    attributes:
      value: New ideas go through the roadmap, so they may be added to a future version or to the Parked list before any code is written.
